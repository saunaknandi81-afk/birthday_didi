<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Happy Birthday 🎉</title>

<style>
body {
  margin: 0;
  font-family: 'Comic Sans MS', cursive;
  background: #fff;
  text-align: center;
}

/* HIDE */
.hidden { display: none; }

/* BUTTON */
.btn {
  padding: 12px 20px;
  background: #ff4da6;
  color: white;
  border: none;
  border-radius: 8px;
  font-size: 18px;
  cursor: pointer;
}

/* GIFT */
.gift-box {
  font-size: 80px;
  cursor: pointer;
}

/* VIDEO BASE */
.fullscreen-video {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: black;
  z-index: 999;

  opacity: 0;
  transform: scale(1.2);
  transition: all 1s ease;
}

/* SHOW ANIMATION */
.fullscreen-video.show {
  opacity: 1;
  transform: scale(1);
}

/* VERTICAL FULL */
.vertical { object-fit: cover; }

/* HORIZONTAL FIT */
.horizontal { object-fit: contain; }

/* EXIT ANIMATION */
.fade-out {
  opacity: 0 !important;
  transform: scale(0.9) !important;
}

/* END TEXT */
#endText {
  position: fixed;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  font-size: 28px;
  color: white;
  background: rgba(0,0,0,0.7);
  padding: 25px;
  border-radius: 15px;

  opacity: 0;
  transition: opacity 1.5s ease;
}

#endText.show {
  opacity: 1;
}

/* CONFETTI */
canvas {
  position: fixed;
  top: 0;
  left: 0;
  pointer-events: none;
}
</style>
</head>

<body>

<!-- FRONT -->
<div id="frontPage">
  <h1>Happyyyyyy Birthdayyyyyy Diiiiiidiiiiii!!! 💖</h1>
  <button class="btn" onclick="startVideo1()">Click Plezzzz 💝</button>
</div>

<!-- VIDEO 1 -->
<div id="video1Page" class="hidden">
  <video id="video1" controls width="90%">
    <source src="video1.mp4">
  </video>
</div>

<!-- GIFT -->
<div id="giftPage" class="hidden">
  <h2>🎁 Tap to Open the Gift 🎁</h2>
  <div class="gift-box" onclick="openGift()">🎁</div>
</div>

<!-- VIDEO 2 -->
<div id="video2aPage" class="hidden">
  <video id="video2a" playsinline webkit-playsinline>
    <source src="video2a.mp4">
  </video>
</div>

<!-- END TEXT -->
<div id="endText">
  💖 You are my one of the most special person 💖
</div>

<canvas id="confetti"></canvas>

<script>

// START VIDEO 1
function startVideo1() {
  frontPage.classList.add("hidden");
  video1Page.classList.remove("hidden");

  let v1 = video1;
  v1.play();

  v1.onended = () => {
    video1Page.classList.add("hidden");
    giftPage.classList.remove("hidden");
  };
}

// OPEN GIFT
function openGift() {
  giftPage.classList.add("hidden");
  video2aPage.classList.remove("hidden");

  let v2 = video2a;

  v2.classList.add("fullscreen-video");

  // detect vertical or horizontal
  v2.onloadedmetadata = () => {
    if (v2.videoHeight > v2.videoWidth) {
      v2.classList.add("vertical");
    } else {
      v2.classList.add("horizontal");
    }
  };

  v2.play();
  startConfetti();

  // cinematic entry
  setTimeout(() => {
    v2.classList.add("show");
  }, 100);

  // when video ends
  v2.onended = () => {

    // cinematic exit
    v2.classList.add("fade-out");

    setTimeout(() => {
      video2aPage.classList.add("hidden");

      // show text
      let txt = document.getElementById("endText");
      txt.classList.add("show");
    }, 1000);
  };
}

// CONFETTI
function startConfetti() {
  const canvas = document.getElementById("confetti");
  const ctx = canvas.getContext("2d");

  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;

  let pieces = [];
  for (let i = 0; i < 120; i++) {
    pieces.push({
      x: Math.random() * canvas.width,
      y: Math.random() * canvas.height,
      dy: Math.random() * 4 + 2
    });
  }

  function update() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    ctx.fillStyle = "pink";

    pieces.forEach(p => {
      ctx.fillRect(p.x, p.y, 6, 6);
      p.y += p.dy;
      if (p.y > canvas.height) p.y = 0;
    });

    requestAnimationFrame(update);
  }

  update();
}

</script>

</body>
</html>
